[project]
name = "voice-agents-lab"
version = "0.1.0"
description = "A from-scratch, testable voice agent pipeline: mic -> STT -> LLM -> TTS -> speaker, with tools, memory, and turn-taking."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26.0",
    "pydantic>=2.0.0",
    "rich>=13.0.0",
    "typer>=0.12.0",
]

[project.optional-dependencies]
audio = [
    "sounddevice>=0.5.0",
    "soundfile>=0.12.1",
]
whisper = [
    "faster-whisper>=1.0.0",
]
anthropic = [
    "anthropic>=0.40.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[project.scripts]
voice-agent = "voiceagents.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["voiceagents"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
